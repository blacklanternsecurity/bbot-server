name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: blacklanternsecurity/CLA/.github/workflows/release-check.yml@e532142ee9e7322888f6edc80d9a89e2f8c0d96d # feat/shared-workflows

  image:
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.read.outputs.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: echo "repository=$(yq -r '.image.repository' helm/values.yaml)" >> "$GITHUB_OUTPUT"

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  docker-tests:
    needs: check
    uses: ./.github/workflows/docker-tests.yml
    secrets: inherit

  pypi:
    needs: [tests, docker-tests]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  docker:
    needs: [check, image, pypi]
    uses: blacklanternsecurity/CLA/.github/workflows/docker.yml@e532142ee9e7322888f6edc80d9a89e2f8c0d96d # feat/shared-workflows
    secrets: inherit
    with:
      image: ${{ needs.image.outputs.repository }}
      version: ${{ needs.check.outputs.version }}
      prerelease: ${{ needs.check.outputs.prerelease }}
      major: ${{ needs.check.outputs.major }}
      minor: ${{ needs.check.outputs.minor }}

  helm:
    needs: [image, docker]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.image.outputs.repository }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: yq -r '.dependencies[].repository' helm/Chart.yaml | sort -u | while read -r url; do helm repo add "${url##*/}" "$url"; done
      - run: helm dependency build helm/
      - id: package
        run: |
          helm package helm/ | sed -n 's|.*saved it to: |chart=|p' >> "$GITHUB_OUTPUT"
      - run: echo "$DOCKER_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKER_USERNAME" --password-stdin
      - run: helm push "${{ steps.package.outputs.chart }}" "oci://registry-1.docker.io/${IMAGE%/*}"

  release:
    needs: [check, docker, helm]
    permissions:
      contents: write
    uses: blacklanternsecurity/CLA/.github/workflows/publish.yml@e532142ee9e7322888f6edc80d9a89e2f8c0d96d # feat/shared-workflows
    with:
      version: ${{ needs.check.outputs.version }}
      prerelease: ${{ needs.check.outputs.prerelease }}
      images: ${{ needs.docker.outputs.images }}
