name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Tag matches the declared version
        id: version
        run: |
          uv run --no-project --with packaging python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess, sys
          from packaging.version import Version
          declared = Version(subprocess.check_output(["uv", "version", "--short"], text=True).strip())
          base = declared.base_version
          expected = f"v{base}-rc.{declared.pre[1]}" if declared.pre and declared.pre[0] == "rc" else f"v{declared}"
          if os.environ["GITHUB_REF_NAME"] != expected or declared.dev is not None or declared.local:
              sys.exit(f"tag {os.environ['GITHUB_REF_NAME']} does not match pyproject.toml {declared} (expected {expected})")
          print(f"version={declared}")
          print(f"semver={expected[1:]}")
          print(f"prerelease={str(declared.is_prerelease).lower()}")
          print(f"major={declared.major}")
          print(f"minor={declared.major}.{declared.minor}")
          PY
      - id: image
        run: echo "image=$(yq -r '.image.repository' helm/values.yaml)" >> "$GITHUB_OUTPUT"

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  docker-tests:
    needs: version
    uses: ./.github/workflows/docker-tests.yml
    secrets: inherit

  pypi:
    needs: [version, tests, docker-tests]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  docker:
    # Docker tags must not move unless the PyPI release shipped
    needs: [version, pypi]
    runs-on: ubuntu-24.04
    env:
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=dev,enable=${{ env.PRERELEASE == 'true' }}
            type=raw,value=latest,enable=${{ env.PRERELEASE == 'false' }}
            type=raw,value=stable,enable=${{ env.PRERELEASE == 'false' }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ env.PRERELEASE == 'false' }}
            type=raw,value=${{ needs.version.outputs.major }},enable=${{ env.PRERELEASE == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    needs: [version, docker]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.version.outputs.image }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: yq -r '.dependencies[].repository' helm/Chart.yaml | sort -u | while read -r url; do helm repo add "${url##*/}" "$url"; done
      - run: helm dependency build helm/
      - id: package
        run: |
          helm package helm/ | sed -n 's|.*saved it to: |chart=|p' >> "$GITHUB_OUTPUT"
      - run: echo "$DOCKER_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKER_USERNAME" --password-stdin
      - run: helm push "${{ steps.package.outputs.chart }}" "oci://registry-1.docker.io/${IMAGE%/*}"

  release:
    needs: [version, helm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ github.event.repository.name }}-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}
          format: spdx-json
          output-file: ${{ github.event.repository.name }}-image-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: GitHub Release with SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ./*.spdx.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${PRERELEASE[@]}"
