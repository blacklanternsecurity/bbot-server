name: publish

on:
  push:
    tags: ["v*", "!archive/**"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Tag matches the declared version
        id: version
        run: |
          uv run --no-project --with packaging python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess, sys
          from packaging.version import Version
          declared = Version(subprocess.check_output(["uv", "version", "--short"], text=True).strip())
          base = declared.base_version
          expected = f"v{base}-rc.{declared.pre[1]}" if declared.pre and declared.pre[0] == "rc" else f"v{declared}"
          if os.environ["GITHUB_REF_NAME"] != expected or declared.dev is not None or declared.local:
              sys.exit(f"tag {os.environ['GITHUB_REF_NAME']} does not match pyproject.toml {declared} (expected {expected})")
          print(f"version={declared}")
          print(f"semver={expected[1:]}")
          print(f"prerelease={str(declared.is_prerelease).lower()}")
          print(f"major={declared.major}")
          print(f"minor={declared.major}.{declared.minor}")
          PY

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  docker-tests:
    needs: version
    uses: ./.github/workflows/docker-tests.yml
    secrets: inherit

  pypi:
    needs: [version, tests, docker-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  docker:
    # Docker tags must not move unless the PyPI release shipped
    needs: [version, pypi]
    runs-on: ubuntu-24.04
    env:
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: blacklanternsecurity
          password: ${{ secrets.DOCKER_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: blacklanternsecurity/bbot-server
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=dev,enable=${{ env.PRERELEASE == 'true' }}
            type=raw,value=latest,enable=${{ env.PRERELEASE == 'false' }}
            type=raw,value=stable,enable=${{ env.PRERELEASE == 'false' }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ env.PRERELEASE == 'false' }}
            type=raw,value=${{ needs.version.outputs.major }},enable=${{ env.PRERELEASE == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    needs: [version, docker]
    runs-on: ubuntu-24.04
    env:
      CHART_VERSION: ${{ needs.version.outputs.semver }}
      APP_VERSION: ${{ needs.version.outputs.version }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm repo add bitnami https://charts.bitnami.com/bitnami
      - run: helm dependency build helm/
      - run: helm package helm/ --version "$CHART_VERSION" --app-version "$APP_VERSION"
      - run: echo "$DOCKER_TOKEN" | helm registry login registry-1.docker.io -u blacklanternsecurity --password-stdin
      - run: helm push "bbot-server-helm-${CHART_VERSION}.tgz" oci://registry-1.docker.io/blacklanternsecurity
